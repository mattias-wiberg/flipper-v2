name: Update Agent Skills

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Update project skills
        run: npx --yes skills update --project --yes

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            .agents/skills
            skills-lock.json
          branch: automation/update-agent-skills
          delete-branch: true
          commit-message: "chore: update agent skills"
          title: "chore: update agent skills"
          body: |
            Updates the repository's installed agent skills from their configured upstream sources.

            This pull request was created automatically by the scheduled skill updater.
